<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FontShelf</title>
  <meta name="description" content="Find any font. Organize every library. Work completely offline on Windows 10 & 11.">
  <meta property="og:title" content="FontShelf">
  <meta property="og:description" content="Find any font. Organize every library. Work completely offline on Windows 10 & 11.">
  <meta property="og:image" content="assets/1.png">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="assets/FontShelfLogo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #111113;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ---- Ambient Background (matching Pomotimer) ---- */
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .bg-blur {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 700px 500px at 22% 28%, rgba(0, 145, 255, 0.08) 0%, transparent 100%),
        radial-gradient(ellipse 640px 520px at 78% 68%, rgba(224, 154, 70, 0.06) 0%, transparent 100%),
        radial-gradient(ellipse 680px 420px at 50% 90%, rgba(67, 97, 238, 0.06) 0%, transparent 100%);
    }

    /* ---- Single-Screen Responsive Layout ---- */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100dvh;
      padding: clamp(16px, 3vh, 32px) clamp(14px, 3vw, 28px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.8vh, 18px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .logo {
      width: clamp(36px, 4.5vh, 48px);
      height: clamp(36px, 4.5vh, 48px);
      object-fit: contain;
    }
    h1 {
      font-weight: 300;
      font-size: clamp(14px, 1.8vw, 18px);
      color: #636366;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    /* ---- Auto Slider ---- */
    .slider-wrap {
      width: 100%;
      max-width: min(92vw, 940px, calc((100dvh - 250px) * (1860 / 1119)));
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex-shrink: 1;
    }

    .slider-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1860 / 1119;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(28, 28, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65), 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .slide-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.65s ease;
      pointer-events: none;
    }
    .slide-img.active {
      opacity: 1;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      background: rgba(20, 20, 24, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #e5e5ea;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, background 0.2s ease;
      z-index: 3;
    }
    .slider-frame:hover .nav-btn,
    .nav-btn:focus-visible {
      opacity: 1;
    }
    .nav-btn:hover {
      background: rgba(44, 44, 50, 0.92);
      color: #fff;
    }
    .nav-btn.prev { left: 12px; }
    .nav-btn.next { right: 12px; }
    .nav-btn svg { width: 16px; height: 16px; }

    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      border: 0;
      padding: 0;
      background: rgba(255, 255, 255, 0.18);
      cursor: pointer;
      transition: width 0.25s ease, background 0.25s ease;
    }
    .dot:hover {
      background: rgba(255, 255, 255, 0.42);
    }
    .dot.active {
      width: 20px;
      background: #0091ff;
    }

    /* ---- CTA (matching Pomotimer) ---- */
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 26px;
      background: rgba(44, 44, 46, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease;
      flex-shrink: 0;
    }
    .cta:hover {
      background: rgba(55, 55, 58, 0.95);
      border-color: rgba(255, 255, 255, 0.16);
    }
    .cta svg {
      width: 16px;
      height: 16px;
      color: #0091ff;
    }

    /* ---- Footer (matching Pomotimer) ---- */
    .footer {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .footer-tagline {
      font-size: 13px;
      color: #636366;
      letter-spacing: 0.5px;
      font-style: italic;
    }
    .footer-madeby {
      font-size: 12px;
      color: #48484a;
    }
    .footer-links {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .footer-links a {
      color: #636366;
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
      text-decoration: none;
    }
    .footer-links a svg { width: 20px; height: 20px; }
    .footer-links a.pp:hover,
    .footer-links a.fb:hover,
    .footer-links a.ms:hover { color: #0091ff; }
    .footer-links a.yt:hover { color: #ff0000; }

    /* ---- Mobile & Short-Screen Tuning ---- */
    @media (max-width: 640px) {
      .slider-wrap {
        max-width: 100%;
      }
      .slider-frame {
        border-radius: 10px;
      }
      .nav-btn {
        display: none;
      }
      .cta {
        padding: 10px 22px;
        font-size: 13.5px;
      }
    }
    @media (max-height: 620px) {
      .page { gap: 8px; padding: 12px 14px; }
      .slider-wrap { max-width: min(92vw, calc((100dvh - 190px) * (1860 / 1119))); gap: 6px; }
      .footer { gap: 4px; }
    }
  </style>
</head>
<body>

        </button>

      <div class="dots" id="slider-dots" role="tablist" aria-label="Choose screenshot"></div>

  <script>
    (function () {
      var slides = Array.prototype.slice.call(document.querySelectorAll('.slide-img'));
      var dotsWrap = document.getElementById('slider-dots');
      var frame = document.getElementById('slider-frame');
      var prevBtn = document.getElementById('prev-btn');
      var nextBtn = document.getElementById('next-btn');
      var current = 0;
      var timer = null;
      var touchStartX = null;

      var dots = slides.map(function (_, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'dot' + (i === 0 ? ' active' : '');
        b.setAttribute('aria-label', 'Slide ' + (i + 1));
        b.addEventListener('click', function () { goTo(i); restart(); });
        dotsWrap.appendChild(b);
        return b;
      });

      function goTo(index) {
        slides[current].classList.remove('active');
        dots[current].classList.remove('active');
        current = (index + slides.length) % slides.length;
        slides[current].classList.add('active');
        dots[current].classList.add('active');
      }

      function start() {
        stop();
        timer = setInterval(function () { goTo(current + 1); }, 3200);
      }

      function stop() {
        if (timer) { clearInterval(timer); timer = null; }
      }

      function restart() {
        start();
      }

      prevBtn.addEventListener('click', function () { goTo(current - 1); restart(); });
      nextBtn.addEventListener('click', function () { goTo(current + 1); restart(); });

      frame.addEventListener('mouseenter', stop);
      frame.addEventListener('mouseleave', start);

      frame.addEventListener('touchstart', function (e) {
        touchStartX = e.touches[0].clientX;
        stop();
      }, { passive: true });
      frame.addEventListener('touchend', function (e) {
        if (touchStartX !== null) {
          var dx = e.changedTouches[0].clientX - touchStartX;
          if (Math.abs(dx) > 36) goTo(current + (dx < 0 ? 1 : -1));
          touchStartX = null;
        }
        start();
      }, { passive: true });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') { goTo(current + 1); restart(); }
        else if (e.key === 'ArrowLeft') { goTo(current - 1); restart(); }
      });

      start();
    })();
  </script>
</body>
</html>
